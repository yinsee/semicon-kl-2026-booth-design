<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Japan 2026 — Booth</title>
<style>
  :root {
    --bg: #15171a; --glass: rgba(18, 20, 24, 0.82); --line: rgba(255,255,255,0.09);
    --text: #e8eaed; --muted: #9aa0a6; --accent: #ffd166; --lock: #ff8a65;
    --nav-h: 48px; --status-h: 28px; --pane-bg: #1b1e22;
    --left-w: 240px; --right-w: 300px;   /* --left-w is set by JS (expanded / minimized) */
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  /* 3D viewport: between the top bar, status bar and the docked Items pane. The Properties pane
     overlays the right edge, so opening / closing it does not move the 3D view. */
  #app { position: fixed; top: var(--nav-h); bottom: var(--status-h); left: var(--left-w); right: 0; }

  /* ---- Top navigation ---- */
  #topnav {
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); z-index: 20;
    display: flex; align-items: center; gap: 16px; padding: 0 12px;
    background: var(--glass); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
  }
  #topnav .brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; white-space: nowrap; }
  #topnav .brand b { color: var(--accent); font-size: 15px; letter-spacing: .3px; }
  #topnav .brand span { color: var(--muted); font-size: 12px; }
  #topnav .group { display: flex; align-items: center; gap: 4px; padding-left: 12px; border-left: 1px solid var(--line); }
  #topnav .group-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; margin-right: 4px; }
  button {
    background: #24272c; color: var(--text); border: 1px solid #3a3e45;
    padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit;
  }
  button:hover:not(:disabled) { background: #30343a; }
  button.active { background: var(--accent); color: #111; border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }

  /* ---- Bottom status bar ---- */
  #statusbar {
    position: fixed; bottom: 0; left: 0; right: 0; height: var(--status-h); z-index: 20;
    display: flex; align-items: center; gap: 18px; padding: 0 12px;
    background: var(--glass); border-top: 1px solid var(--line); backdrop-filter: blur(8px);
    font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden;
  }
  #statusbar b { color: var(--text); font-weight: 600; }
  #statusbar .sel { color: var(--accent); }
  #statusbar .spacer { margin-left: auto; }

  /* ---- Docked side panes: Items (left), Properties (right); shown / hidden from the top bar ---- */
  .pane {
    position: fixed; top: var(--nav-h); bottom: var(--status-h); z-index: 15;
    display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;
    background: var(--pane-bg);
  }
  #pane-left  { left: 0;  width: var(--left-w);  border-right: 1px solid var(--line); }
  #pane-right { right: 0; width: var(--right-w); border-left: 1px solid var(--line); }
  .pane.off { display: none; }
  .pane > header {
    flex: none; height: 34px; display: flex; align-items: center; padding: 0 12px;
    border-bottom: 1px solid var(--line);
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
  }
  .pane > .body { flex: 1; overflow-y: auto; padding: 10px 12px; font-size: 13px; line-height: 1.6; }

  /* Pane toggle icons in the top bar */
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 28px; padding: 0; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.active { background: #24272c; color: var(--accent); border-color: var(--accent); }
  #topnav .group .icon-btn.active { background: var(--accent); color: #111; border-color: var(--accent); }

  /* Properties panel content */
  #info .empty { color: var(--muted); font-size: 12px; }
  #info .name { color: var(--accent); font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  #info .row { display: flex; justify-content: space-between; gap: 16px; }
  #info .row span:first-child { color: var(--muted); }
  #info .row.arm { align-items: center; }
  #info .row.arm span:first-child { white-space: nowrap; }
  #info .row.arm input { flex: 1; min-width: 90px; }
  #info .row.arm .val { width: 34px; text-align: right; color: var(--text); }
  #info select {
    margin-top: 6px; width: 100%; background: #24272c; color: var(--text);
    border: 1px solid #3a3e45; border-radius: 6px; padding: 4px 6px; font-size: 12px;
  }
  #info .lock-row { align-items: center; margin: 4px 0; cursor: pointer; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .slider { position: absolute; inset: 0; background: #555; border-radius: 10px; transition: background .15s; }
  .switch .slider::before { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px;
    background: #eee; border-radius: 50%; transition: transform .15s; }
  .switch input:checked + .slider { background: var(--lock); }
  .switch input:checked + .slider::before { transform: translateX(16px); }

  /* Items panel */
  #item-list { list-style: none; margin: 0 -6px; padding: 0; }
  /* Minimized Items pane: icon-only rail */
  #pane-left.mini > .body { padding: 8px 4px; }
  #pane-left.mini #item-list { margin: 0; }
  #pane-left.mini #item-list li { justify-content: center; padding: 6px 0; }
  #pane-left.mini #item-list li { position: relative; }
  #pane-left.mini #item-list li .nm, #pane-left.mini #item-list li:not(.locked) .lk { display: none; }
  /* Minimized: a small lock badge on the item icon */
  #pane-left.mini #item-list li.locked .lk { position: absolute; right: 6px; bottom: 2px; pointer-events: none; }
  #pane-left.mini #item-list li.locked .lk svg { width: 10px; height: 10px; }
  .pane > header { justify-content: space-between; }
  .close-btn { background: none; border: none; color: var(--muted); font-size: 14px; padding: 2px 6px; }
  .close-btn:hover:not(:disabled) { background: #30343a; color: var(--text); }
  #item-list li .ic { display: inline-flex; flex: none; color: var(--muted); }
  #item-list li.sep { height: 0; padding: 0; margin: 6px 6px; border-top: 1px solid var(--line); border-radius: 0; cursor: default; pointer-events: none; }
  /* Anchored (child) items: indented under their parent with a guide line */
  #item-list li.child { margin-left: 14px; padding-left: 10px; border-left: 1px solid var(--line); border-radius: 0 5px 5px 0; }
  #pane-left.mini #item-list li.child { margin-left: 8px; padding-left: 0; }
  #pane-left.mini #item-list li.child .ic svg { width: 13px; height: 13px; }
  #item-list li .ic svg { width: 16px; height: 16px; }
  #item-list li.selected .ic { color: var(--accent); }
  #item-list li .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #item-list li {
    display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 5px;
    cursor: pointer; font-size: 12px;
  }
  #item-list li:hover { background: rgba(255,255,255,0.06); }
  #item-list li.selected { background: rgba(255, 209, 102, 0.18); color: var(--accent); }
  /* Lock icon at the end of each row: always shown when locked, on row hover when unlocked */
  #item-list li .lk { display: inline-flex; flex: none; color: var(--lock); cursor: pointer; opacity: 0; }
  #item-list li .lk svg { width: 14px; height: 14px; }
  #item-list li.locked .lk { opacity: 1; }
  #item-list li:not(.locked) .lk { color: var(--muted); }
  #item-list li:hover .lk { opacity: 1; }
  #item-list li .vis { display: inline-flex; flex: none; color: var(--muted); cursor: pointer; opacity: 0; }
  #item-list li .vis svg { width: 14px; height: 14px; }
  #item-list li:hover .vis, #item-list li.hidden-item .vis { opacity: 1; }
  #item-list li.hidden-item .nm, #item-list li.hidden-item .ic,
  #item-list li.parent-hidden .nm, #item-list li.parent-hidden .ic { opacity: .4; }
  #item-list li.parent-hidden .vis { opacity: .4; pointer-events: none; }   /* follows the parent */
  #pane-left.mini #item-list li .vis { display: none; }
  #item-list li[data-id="booth"] .vis { visibility: hidden; }
  #item-list li[data-id="booth"] .lk { cursor: default; }
  #statusbar .lock-tag { display: inline-flex; align-items: center; gap: 3px; color: var(--lock); }
  #statusbar .lock-tag svg { width: 12px; height: 12px; }

  #statusbar kbd { background: #2a2d33; border: 1px solid #3a3e45; border-radius: 4px; padding: 0 4px;
    font-size: 11px; color: var(--text); font-family: inherit; }
  #statusbar .hints { overflow: hidden; text-overflow: ellipsis; }

  @media (max-width: 760px) {
    #topnav .group-label, #topnav .brand span { display: none; }
    #topnav { gap: 8px; overflow-x: auto; }
  }
</style>
</head>
<body>
<div id="app"></div>

<header id="topnav">
  <button id="toggle-left" class="icon-btn active" title="Expand / minimize Items pane"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></button>
  <div class="brand"><b>Japan 2026</b><span>Booth design</span></div>
  <div class="group" title="Camera view">
    <button id="view-persp" class="icon-btn active" title="Perspective view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l6-4h10v12l-6 4H4z"/><path d="M4 8h10v12M14 8l6-4"/></svg></button>
    <button id="view-top" class="icon-btn" title="Top view (plan)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M12 8v8M8 12h8"/></svg></button>
    <button id="view-front" class="icon-btn" title="Front view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="14" rx="1"/><path d="M4 10h16M9 20v-6h6v6"/></svg></button>
    <button id="view-visitor" class="icon-btn" title="Visitor view: standing in front of the 3D fan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v7M8 11l4-2 4 2M10 21l2-6 2 6"/></svg></button>
    <button id="toggle-iso" class="icon-btn" title="Isometric (orthographic) camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
  </div>
  <div class="group" title="Guides">
    <button id="toggle-grid" class="icon-btn active" title="Floor grid + light bulbs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7.5 6.5l9 5M16.5 6.5l-9 5"/><path d="M3 15l9 5 9-5" opacity=".5"/></svg></button>
    <button id="toggle-ygrid" class="icon-btn" title="Height (Y) grid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V3M5 7h4M5 11h6M5 15h4M5 19h6"/><path d="M14 21V9l6-4v12z"/></svg></button>
  </div>
  <div class="group" title="Edit">
    <button id="undo" class="icon-btn" title="Undo last change (Ctrl/⌘ + Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button id="reset-layout" class="icon-btn" title="Reset: clear saved layout and reload with defaults"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
  </div>
</header>

<aside class="pane" id="pane-left">
  <div class="body"><ul id="item-list"></ul></div>
</aside>

<aside class="pane" id="pane-right">
  <header><span class="title">Properties</span><button id="close-props" class="close-btn" title="Close (deselect)">✕</button></header>
  <div class="body" id="info"></div>
</aside>

<footer id="statusbar">
  <span id="status-sel">No item selected</span>
  <span class="spacer"></span>
  <span class="hints"><kbd>Click</kbd> select · <kbd>Drag</kbd> orbit / move selected · <kbd>Shift</kbd>+drag rotate selected / pan · <kbd>Scroll</kbd> zoom · <kbd>Double-click</kbd> lock / unlock (booth or list) · <kbd>Ctrl/⌘</kbd>+<kbd>Z</kbd> undo</span>
  <span id="status-items"></span>
  <span id="status-undo">Undo: 0</span>
</footer>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// --- Dimensions (meters) ---
const ROOM_W = 3;       // X: width
const ROOM_D = 3;       // Z: depth
const WALL_H = 2.706;   // Y: wall height (2706 mm)
const WALL_T = 0.08;    // wall thickness

// --- Renderer ---
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(app.clientWidth, app.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // PCF honours shadow.radius (blur); PCFSoft ignores it
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
app.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);

// --- Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a4048); // brighter than the target look: OutputPass tone-maps the background too
scene.fog = new THREE.Fog(0x3a4048, 20, 60);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// --- Cameras ---
const camera = new THREE.PerspectiveCamera(50, app.clientWidth / app.clientHeight, 0.1, 200);
camera.position.set(6, 4.5, 7);

// Origin is the booth's back-left corner (plan view). Floor spans X: 0..3, Z: 0..3.
// Orbit pivot: booth centre (plan centre, mid eye height). The camera always rotates around it.
const center = new THREE.Vector3(ROOM_W / 2, 1.2, ROOM_D / 2);

const isoCamera = new THREE.OrthographicCamera();
isoCamera.near = -50; isoCamera.far = 100;
function fitIsoFrustum() {
  const halfH = 3;
  const halfW = halfH * app.clientWidth / app.clientHeight;
  isoCamera.left = -halfW; isoCamera.right = halfW;
  isoCamera.top  =  halfH; isoCamera.bottom = -halfH;
  isoCamera.updateProjectionMatrix();
}
fitIsoFrustum();
{
  const dist = 15;
  const elev = Math.atan(1 / Math.SQRT2);
  const azim = Math.PI / 4;
  isoCamera.position.set(
    center.x + dist * Math.cos(elev) * Math.sin(azim),
              dist * Math.sin(elev),
    center.z + dist * Math.cos(elev) * Math.cos(azim),
  );
  isoCamera.lookAt(center);
}

let activeCamera = camera;
let controls;
function bindControls(cam) {
  if (controls) controls.dispose();
  controls = new OrbitControls(cam, renderer.domElement);
  controls.target.copy(center);
  // Pan: Shift + drag on empty space (OrbitControls' modifier pan) or right-drag.
  // Each view button puts the pivot back on the booth centre.
  controls.screenSpacePanning = true;
  controls.enableDamping = true;
  setControlMode('orbit');
}
// 'orbit': normal booth orbit around the pivot.
// 'look' : first-person visitor — the eye stays put and drag turns the head. The pivot sits
//          5 cm in front of the eye, so orbiting it is effectively looking around.
let controlMode = 'orbit';
const LOOK_RADIUS = 0.05;
function setControlMode(mode) {
  controlMode = mode;
  const look = mode === 'look';
  controls.enablePan = !look;
  controls.enableZoom = !look;             // in look mode the wheel changes the field of view instead
  controls.minDistance = look ? LOOK_RADIUS : 1.5;
  controls.maxDistance = look ? LOOK_RADIUS : 30;
  controls.minPolarAngle = look ? 0.35 : 0;                       // look up / down within limits
  controls.maxPolarAngle = look ? Math.PI - 0.35 : Math.PI / 2 - 0.01;
  controls.rotateSpeed = look ? -0.35 : 1;   // look: drag "grabs" the view (same feel as orbiting), slower
  if (!look && camera.fov !== 50) { camera.fov = 50; camera.updateProjectionMatrix(); }
}
// Visitor look mode: scroll = zoom by field of view (eye does not move)
renderer.domElement.addEventListener('wheel', (e) => {
  if (controlMode !== 'look') return;
  e.preventDefault();
  camera.fov = THREE.MathUtils.clamp(camera.fov + Math.sign(e.deltaY) * 3, 25, 80);
  camera.updateProjectionMatrix();
}, { passive: false });
bindControls(camera);

// --- Lighting ---
const hemi = new THREE.HemisphereLight(0xffffff, 0x404050, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(5, 10, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -8;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0005;
sun.shadow.radius = 8;     // soft, blurred edges
scene.add(sun);

// Booth point lights — draggable (X, Y) via the visible bulb
function addPointLight(x, y, z, { id, intensity = 14 } = {}) {
  const light = new THREE.PointLight(0xffffff, intensity, 10, 1.6);
  light.castShadow = true;
  light.shadow.mapSize.set(512, 512);
  light.shadow.bias = -0.0005;
  light.shadow.radius = 6;

  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 20, 14),
    new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0xffe6a8, emissiveIntensity: 1.1, roughness: 0.5 }),
  );
  bulb.add(light);
  bulb.userData = { id, isLight: true, draggable: true, w: 0.18, d: 0.18, h: 0.18 };

  const saved = savedLayout[id];
  // Lights drag only in X and Y; Z is always the initial value.
  bulb.position.set(saved ? saved.x : x, saved ? (saved.y ?? y) : y, z);
  scene.add(bulb);
  furniture.push(bulb);
  return bulb;
}

// --- Ground (outside the booth) ---
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x2a2f33, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(ROOM_W / 2, -0.001, ROOM_D / 2);
ground.receiveShadow = true;
scene.add(ground);

// --- Procedural mid-grey carpet texture (tileable needle-punch / short-pile look) ---
function makeCarpetTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#76787c'; // mid grey
  ctx.fillRect(0, 0, size, size);
  // Fine per-pixel fibre noise (slightly varied tone per channel → heathered look)
  const img = ctx.getImageData(0, 0, size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 46;
    const t = (Math.random() - 0.5) * 6;
    d[i]   = Math.max(0, Math.min(255, d[i]   + n + t));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n - t));
  }
  ctx.putImageData(img, 0, 0);
  // Soft mottling (large low-contrast blotches), wrapped so the tile repeats seamlessly
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * size, y = Math.random() * size, r = 20 + Math.random() * 50;
    const light = Math.random() < 0.5;
    for (const [ox, oy] of [[0, 0], [size, 0], [-size, 0], [0, size], [0, -size]]) {
      const grad = ctx.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r);
      grad.addColorStop(0, light ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(x + ox - r, y + oy - r, r * 2, r * 2);
    }
  }
  // Short fibre strokes in random directions (dark and light)
  for (let i = 0; i < 16000; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const len = 1.5 + Math.random() * 3, ang = Math.random() * Math.PI * 2;
    const shade = Math.random() < 0.5 ? 70 + Math.random() * 25 : 140 + Math.random() * 30;
    ctx.strokeStyle = `rgba(${shade},${shade},${shade + 2},0.45)`;
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const carpetMap = makeCarpetTexture();
carpetMap.repeat.set(ROOM_W * 2, ROOM_D * 2); // 1 tile per 0.5 m

// --- Undo history ---
// Every saveLayout() compares the new state with the last saved one; if it differs, the
// previous state goes onto the undo stack. Undo restores that state into the scene.
const UNDO_LIMIT = 50;
const undoStack = [];
let lastSavedJson = null;
function recordUndo(data) {
  const json = JSON.stringify(data);
  if (lastSavedJson !== null && json !== lastSavedJson) {
    undoStack.push(lastSavedJson);
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  }
  lastSavedJson = json;
  const btn = document.getElementById('undo');
  if (btn) btn.disabled = undoStack.length === 0;
  const st = document.getElementById('status-undo');
  if (st) st.textContent = `Undo: ${undoStack.length}`;
}
function undo() {
  if (!undoStack.length || drag.obj) return;
  const prevJson = undoStack.pop();
  applyLayoutState(JSON.parse(prevJson));
  lastSavedJson = prevJson;                      // restoring is not a new change
  try { localStorage.setItem(STORAGE_KEY, prevJson); } catch {}
  document.getElementById('undo').disabled = undoStack.length === 0;
  if (infoObj) { const o = infoObj; infoObj = null; showInfo(o); } // rebuild panel with restored values
  else updateStatus();
}
function applyLayoutState(state) {
  for (const m of furniture) {
    const st = state[m.userData.id];
    if (!st) continue;
    m.position.set(st.x, st.y, st.z);
    m.rotation.y = st.ry ?? 0;
    if (st.screen && m.userData.screenMat) setScreen(m, st.screen);
    if (st.arm && m.userData.arm) { Object.assign(m.userData.arm, st.arm); updateArm(m); }
    m.userData.locked = !!st.locked;
    m.visible = !st.hidden;
    if (st.graphic && m.userData.graphicMat) setGraphic(m, st.graphic);
  }
}

function makeVideoElement(src) {
  const el = document.createElement('video');
  Object.assign(el, { src, loop: true, muted: true, playsInline: true, autoplay: true, preload: 'auto', crossOrigin: 'anonymous' });
  el.style.display = 'none';
  document.body.appendChild(el);
  el.addEventListener('error', () => console.warn(`[video] load failed: ${src}`, el.error));
  el.play().catch(() => window.addEventListener('pointerdown', () => el.play().catch(() => {}), { once: true }));
  return el;
}

function addStandingTV({ id, x = 0, z = 0, diagIn = 42, totalH = 1.35, aspect = 16 / 9 } = {}) {
  const diag = diagIn * 0.0254;
  const tvW = diag * aspect / Math.hypot(aspect, 1);
  const tvH = diag * 1       / Math.hypot(aspect, 1);

  const baseW = Math.max(0.6, tvW * 0.45), baseD = 0.4, baseT = 0.03;
  const W = Math.max(tvW, baseW), D = baseD, H = totalH;
  const tvCenterY = totalH - tvH / 2;

  const group = new THREE.Group();
  group.userData = { id, w: W, d: D, h: H, draggable: true };

  const frameMat  = new THREE.MeshStandardMaterial({ color: 0x0f0f10, roughness: 0.4, metalness: 0.5 });
  const baseMat   = new THREE.MeshStandardMaterial({ color: 0x1a1a1d, roughness: 0.5, metalness: 0.6 });
  const screenMat = makeScreenMaterial(group, 'display');

  const base = new THREE.Mesh(new THREE.BoxGeometry(baseW, baseT, baseD), baseMat);
  base.position.set(0, baseT / 2, 0);
  base.castShadow = base.receiveShadow = true;
  group.add(base);

  const pole = new THREE.Mesh(new THREE.BoxGeometry(0.09, totalH - baseT, 0.09), frameMat);
  pole.position.set(0, baseT + (totalH - baseT) / 2, -0.12);
  pole.castShadow = true;
  group.add(pole);

  const frame = new THREE.Mesh(new THREE.BoxGeometry(tvW + 0.04, tvH + 0.04, 0.06), frameMat);
  frame.position.set(0, tvCenterY, -0.04);
  frame.castShadow = true;
  group.add(frame);

// Make a mesh non-pickable so raycasts pass through it (glass / overlay planes).
function nonPickable(obj) { obj.raycast = () => {}; return obj; }

// --- 3D hologram fan display (2×3 fans on a frame, on a base plate) ---
function addFanDisplay({ id, x = 0, z = 0 } = {}) {
  const W = 2 * 0.3048, D = 2 * 0.3048, H = 1.5; // 2 ft × 2 ft × 1.5 m
  const group = new THREE.Group();
  group.userData = { id, w: W, d: D, h: H, draggable: true };

  // Base plate (100 × 64 cm)
  {
    const plateW = 1.0, plateD = 0.64, plateT = 0.05;
    const plateMat = new THREE.MeshStandardMaterial({ color: 0x1f2226, roughness: 0.55, metalness: 0.25 });
    const plate = new THREE.Mesh(new THREE.BoxGeometry(plateW, plateT, plateD), plateMat);
    plate.position.set(0, plateT / 2, 0);
    plate.castShadow = plate.receiveShadow = true;
    group.add(plate);
    group.userData.w = Math.max(group.userData.w, plateW);
    group.userData.d = Math.max(group.userData.d, plateD);
  }

  // Black frame: 2 posts + 3 crossbars
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.55, metalness: 0.45 });
  const colsX = [-W / 4, +W / 4];
  const rowsY = [0.35, 0.80, 1.25];
  // Posts stop flush with the top crossbar (no protrusion above the top fans)
  const postH = rowsY[rowsY.length - 1] + 0.035 / 2;
  for (const px of colsX) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.035, postH, 0.035), frameMat);
    post.position.set(px, postH / 2, 0);
    post.castShadow = true;
    group.add(post);
  }
  for (const py of rowsY) {
    const beam = new THREE.Mesh(new THREE.BoxGeometry(colsX[1] - colsX[0] + 0.035, 0.035, 0.035), frameMat);
    beam.position.set(0, py, 0);
    group.add(beam);
  }

  // 6 fans: spinning blades blurred into a glowing disc
  const hubMat = new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.5, metalness: 0.4 });
  const discMat = new THREE.MeshStandardMaterial({
    color: 0x2a8cff, emissive: 0x2a8cff, emissiveIntensity: 1.2, roughness: 0.3,
    transparent: true, opacity: 0.45, side: THREE.DoubleSide,
  });
  const fanR = 0.10;
  for (const py of rowsY) {
    for (const px of colsX) {
      const fan = new THREE.Group();
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(fanR, fanR, 0.006, 48), discMat);
      disc.rotation.x = Math.PI / 2;
      fan.add(disc);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.025, 24), hubMat);
      hub.rotation.x = Math.PI / 2;
      hub.position.z = 0.008;
      fan.add(hub);
      fan.position.set(px, py, 0.03);
      group.add(fan);
    }
  }

  // Projected operator hologram (no glass): additive planes just in front of / behind the fans.
  // Starts with the JPEG, then swaps to the MP4 once it can play.
  {
    const holoW = 0.81, holoH = 1.61, holoY = 0.05 + holoH / 2, holoZ = 0.05;
    const opTex = new THREE.TextureLoader().load('assets/operator.jpeg');
    opTex.colorSpace = THREE.SRGBColorSpace;
    const overlayMat = new THREE.MeshBasicMaterial({
      map: opTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    const geo = new THREE.PlaneGeometry(holoW, holoH);
    const overlay = new THREE.Mesh(geo, overlayMat);
    overlay.position.set(0, holoY, holoZ);
    group.add(nonPickable(overlay));
    const overlayBack = new THREE.Mesh(geo, overlayMat);
    overlayBack.position.set(0, holoY, -holoZ);
    overlayBack.rotation.y = Math.PI;
    group.add(nonPickable(overlayBack));

    const opVideoEl = makeVideoElement('assets/operator.mp4');
    opVideoEl.addEventListener('canplay', () => {
      const vt = new THREE.VideoTexture(opVideoEl);
      vt.colorSpace = THREE.SRGBColorSpace;
      overlayMat.map = vt;
      overlayMat.needsUpdate = true;
    }, { once: true });
    group.userData.h = Math.max(group.userData.h, 0.05 + holoH);
  }

  const saved = savedLayout[id];
  if (saved) {
    group.position.set(saved.x, 0, saved.z);
    group.rotation.y = saved.ry ?? 0;
  } else {
    group.position.set(x, 0, z);
  }
  scene.add(group);
  furniture.push(group);
  return group;
}

function makeCounterLogoTexture(pxW, pxH) {
  const c = document.createElement('canvas');
  c.width = pxW; c.height = pxH;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f5f6';
  g.fillRect(0, 0, pxW, pxH);
  const cy = pxH * 0.5, s = pxH / 690;            // scale to canvas height
  const blue = '#1d3f8f';
  // Icon: open ring with a vertical bar (power-symbol style)
  const ix = pxW * 0.14, r = 70 * s;
  g.strokeStyle = blue; g.lineWidth = 22 * s; g.lineCap = 'round';
  g.beginPath(); g.arc(ix, cy, r, -Math.PI * 0.32, Math.PI * 1.32); g.stroke();
  g.fillStyle = blue;
  g.fillRect(ix - 11 * s, cy - r - 10 * s, 22 * s, r * 1.05);
  g.beginPath(); g.arc(ix, cy + 18 * s, 22 * s, 0, Math.PI * 2); g.fill();
  // Wordmark
  g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  g.font = `600 ${120 * s}px system-ui, sans-serif`;
  g.fillText('BioEnergy', ix + r + 40 * s, cy + 20 * s);
  g.font = `600 ${46 * s}px system-ui, sans-serif`;
  g.fillText('Projects Sdn Bhd', ix + r + 120 * s, cy + 90 * s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function makeQueueStrap() {

    new THREE.MeshStandardMaterial({ color: 0xc02020, roughness: 0.6, metalness: 0.05 }),

function updateQueueStraps() {
  for (let i = 0; i < queueStraps.length; i++) {
    const a = queuePoles[i].position, b = queuePoles[i + 1].position;
    const dx = b.x - a.x, dz = b.z - a.z;
    const s = queueStraps[i];
    s.position.set((a.x + b.x) / 2, QUEUE_STRAP_Y, (a.z + b.z) / 2);
    s.scale.x = Math.max(Math.hypot(dx, dz), 0.001);
    s.rotation.y = -Math.atan2(dz, dx);
  }
}

// --- Desktop items: sit on a surface at height `y` (e.g. the counter top) ---
// Drag moves them in X/Z only, so they keep their surface height.
// With `parent` (e.g. the counter), the item is anchored to it: x/z/ry are in the parent's
// local frame, y is the parent's top (userData.h), and it follows the parent when that moves
// or rotates. Drag keeps it on the parent's top (see 'surface' drag mode).
function placeOnSurface(group, { id, x, y, z, ry = 0, parent = null }) {
  const saved = savedLayout[id];
  if (!parent) {
    group.position.set(saved ? saved.x : x, y, saved ? saved.z : z);
    group.rotation.y = saved ? (saved.ry ?? ry) : ry;
    scene.add(group);
  } else {
    group.userData.parentId = parent.userData.id;
    parent.add(group);
    const topY = parent.userData.h;
    if (saved && saved.local) {
      group.position.set(saved.x, topY, saved.z);
      group.rotation.y = saved.ry ?? ry;
    } else if (saved) {
      // Older layout saved world coords → convert into the parent's frame once
      parent.updateMatrixWorld(true);
      const v = parent.worldToLocal(new THREE.Vector3(saved.x, 0, saved.z));
      group.position.set(v.x, topY, v.z);
      group.rotation.y = (saved.ry ?? 0) - parent.rotation.y;
    } else {
      group.position.set(x, topY, z);
      group.rotation.y = ry;
    }
    clampToParentTop(group);
  }
  furniture.push(group);
  return group;
}
// Keep an anchored item fully on its parent's top. userData.lockZ pins local z (edge clamps).
function clampToParentTop(obj) {
  const P = obj.parent.userData, { w, d, lockZ } = obj.userData;
  const c = Math.abs(Math.cos(obj.rotation.y)), sn = Math.abs(Math.sin(obj.rotation.y));
  const hw = c * w / 2 + sn * d / 2, hd = sn * w / 2 + c * d / 2;
  obj.position.x = THREE.MathUtils.clamp(obj.position.x, -P.w / 2 + hw, P.w / 2 - hw);
  obj.position.z = lockZ !== undefined ? lockZ
    : THREE.MathUtils.clamp(obj.position.z, -P.d / 2 + hd, P.d / 2 - hd);
  if (lockZ !== undefined) obj.rotation.y = 0; // edge clamp stays square to the table edge
}

// 15.6" monitor on a 2-segment swivel arm clamped to the back edge of the table.
// Joints: pole top swivels (yaw, whole arm), segment 1 and segment 2 each tilt up/down
// (pitch); the screen head counter-tilts so the screen stays upright. Screen faces the
// swivel direction (+Z at swivel 0). Angles live in userData.arm and are saved with the layout.
// Group origin is on the table top; the clamp + pole sit at local z = −clampZ.
const ARM_L1 = 0.18, ARM_L2 = 0.16, ARM_POLE_H = 0.2;
const ARM_LIMITS = { swivel: [-90, 90], a1: [-30, 60], a2: [-60, 45] }; // degrees
function addArmMonitor({ id, x = 0, y = 0, z = 0, diagIn = 15.6, aspect = 16 / 9, clampZ = 0.12, parent = null } = {}) {
  const diag = diagIn * 0.0254;
  const sw = diag * aspect / Math.hypot(aspect, 1);
  const sh = diag / Math.hypot(aspect, 1);
  const bezel = 0.006;
  const group = new THREE.Group();
  group.userData = { id, w: sw + bezel * 2, d: clampZ + 0.03, h: 0.4, draggable: true, screenH: sh + bezel * 2,
                     arm: { swivel: 0, a1: 20, a2: -10, ...(savedLayout[id]?.arm ?? {}) } };

  const armMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1d, roughness: 0.4, metalness: 0.6 });
  const blackMat = new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.45, metalness: 0.3 });
  const screenMat = makeScreenMaterial(group, 'img6', { intensity: 0.45, roughness: 0.25 });
  const mesh = (parentObj, geo, mat, px, py, pz) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(px, py, pz);
    m.castShadow = true;
    parentObj.add(m);
    return m;
  };
  const cylX = (r, len) => new THREE.CylinderGeometry(r, r, len, 20).rotateZ(Math.PI / 2); // axis along X (pitch joint)
  const cylZ = (r, len) => new THREE.CylinderGeometry(r, r, len, 16).rotateX(Math.PI / 2); // axis along Z (arm link)

  // Clamp square to the table's back edge (edge line = local z = −clampZ):
  // top plate lies on the table, rear plate runs flush down the back face.
  const edgeZ = -clampZ, plateT = 0.012, topLen = 0.08;
  mesh(group, new THREE.BoxGeometry(0.07, plateT, topLen + plateT), armMat, 0, plateT / 2, edgeZ - plateT + (topLen + plateT) / 2); // top plate
  mesh(group, new THREE.BoxGeometry(0.07, 0.08, plateT), armMat, 0, plateT - 0.04, edgeZ - plateT / 2);                           // rear plate
  const knob = mesh(group, new THREE.CylinderGeometry(0.012, 0.012, 0.02, 16).rotateX(Math.PI / 2), armMat, 0, -0.045, edgeZ - plateT - 0.01); // clamp screw knob
  knob.castShadow = false;
  // Pole stands on the top plate, just inside the edge
  const cz = edgeZ + 0.03;
  mesh(group, new THREE.CylinderGeometry(0.014, 0.014, ARM_POLE_H, 20), armMat, 0, ARM_POLE_H / 2, cz);
  mesh(group, new THREE.CylinderGeometry(0.018, 0.018, 0.03, 20), armMat, 0, plateT + 0.015, cz); // pole collar

  // Joint chain: swivel (yaw) → segment 1 (pitch) → segment 2 (pitch) → head (counter-pitch)
  const swivel = new THREE.Object3D();
  swivel.position.set(0, ARM_POLE_H, cz);
  group.add(swivel);
  mesh(swivel, new THREE.CylinderGeometry(0.02, 0.02, 0.035, 20), armMat, 0, 0, 0); // swivel joint
  const seg1 = new THREE.Object3D();
  swivel.add(seg1);
  mesh(seg1, cylX(0.016, 0.04), armMat, 0, 0, 0);                        // shoulder pitch joint
  mesh(seg1, cylZ(0.012, ARM_L1), armMat, 0, 0, ARM_L1 / 2);             // segment 1
  const seg2 = new THREE.Object3D();
  seg2.position.z = ARM_L1;
  seg1.add(seg2);
  mesh(seg2, cylX(0.015, 0.036), armMat, 0, 0, 0);                       // elbow pitch joint
  mesh(seg2, cylZ(0.011, ARM_L2), armMat, 0, 0, ARM_L2 / 2);             // segment 2
  const head = new THREE.Object3D();
  head.position.z = ARM_L2;
  seg2.add(head);
  mesh(head, cylX(0.013, 0.03), armMat, 0, 0, 0);                        // head tilt joint
  mesh(head, new THREE.BoxGeometry(0.075, 0.075, 0.012), armMat, 0, 0, 0.012); // VESA plate
  mesh(head, new THREE.BoxGeometry(sw + bezel * 2, sh + bezel * 2, 0.014), blackMat, 0, 0, 0.025);
  const screen = mesh(head, new THREE.PlaneGeometry(sw, sh), screenMat, 0, 0, 0.0325);
  screen.castShadow = false;
  group.userData.joints = { swivel, seg1, seg2, head };
  updateArm(group);

  if (parent) group.userData.lockZ = -parent.userData.d / 2 + clampZ; // clamp sits on the back edge; slides along it only
  return placeOnSurface(group, { id, x, y, z, ry: 0, parent });
}
// Apply userData.arm angles (degrees, clamped to ARM_LIMITS) to the joint chain.
function updateArm(group) {
  const arm = group.userData.arm, { swivel, seg1, seg2, head } = group.userData.joints;
  for (const k of Object.keys(ARM_LIMITS)) arm[k] = THREE.MathUtils.clamp(arm[k], ...ARM_LIMITS[k]);
  const r = THREE.MathUtils.degToRad;
  swivel.rotation.y = r(arm.swivel);
  seg1.rotation.x = -r(arm.a1);            // +angle lifts the segment
  seg2.rotation.x = -r(arm.a2 - arm.a1);   // a2 is absolute (relative to horizontal)
  head.rotation.x = r(arm.a2);             // keep the screen upright
  const headY = ARM_POLE_H + ARM_L1 * Math.sin(r(arm.a1)) + ARM_L2 * Math.sin(r(arm.a2));
  group.userData.h = headY + group.userData.screenH / 2;
}

// Unysis box: 13 × 13 × 10 cm black edge-AI controller (front = +Z).
// Front: BioEnergy logo, UNYSIS label, TYPE/MODEL table, ports, switch, LED.
// Sides: chevron vents. Top: concentric rings + small UNYSIS mark.
const UNYSIS_PX_PER_MM = 8;
function makeUnysisCanvas(wMm, hMm, draw) {
  const k = UNYSIS_PX_PER_MM;
  const c = document.createElement('canvas');
  c.width = wMm * k; c.height = hMm * k;
  const g = c.getContext('2d');
  g.scale(k, k);                     // draw in millimetres
  g.fillStyle = '#121214';
  g.fillRect(0, 0, wMm, hMm);
  draw(g);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function drawUnysisFront(g) {
  // UNYSIS title
  g.fillStyle = '#ffffff';
  g.font = '700 15px Arial, Helvetica, sans-serif';
  g.textAlign = 'right'; g.textBaseline = 'alphabetic';
  g.fillText('UNYSIS', 121, 33);
  // BioEnergy logo: ring + bar + red dot
  const ix = 13, iy = 46, r = 4.6;
  g.strokeStyle = '#ffffff'; g.lineWidth = 1.4; g.lineCap = 'round';
  g.beginPath(); g.arc(ix, iy, r, -Math.PI * 0.3, Math.PI * 1.3); g.stroke();
  g.beginPath(); g.moveTo(ix, iy - r - 0.6); g.lineTo(ix, iy + 1); g.stroke();
  g.fillStyle = '#e02020';
  g.beginPath(); g.arc(ix + 1.6, iy - r - 1.4, 0.9, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#ffffff'; g.textAlign = 'left';
  g.font = '700 7.5px Arial, Helvetica, sans-serif';
  g.fillText('BioEnergy', ix + r + 2, iy + 2.4);

function addUnisysBox({ id, x = 0, y = 0, z = 0, ry = 0, parent = null } = {}) {
  const W = 0.13, D = 0.13, H = 0.10;
  const group = new THREE.Group();
  group.userData = { id, w: W, d: D, h: H, draggable: true };

  const mat = (tex) => new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45, metalness: 0.2 });
  const plain = new THREE.MeshStandardMaterial({ color: 0x121214, roughness: 0.45, metalness: 0.2 });
  const front = mat(makeUnysisCanvas(130, 100, drawUnysisFront));
  const sideL = mat(makeUnysisCanvas(130, 100, g => drawUnysisSide(g, true)));   // −X: chevrons point to front
  const sideR = mat(makeUnysisCanvas(130, 100, g => drawUnysisSide(g, false)));  // +X: mirrored
  const top   = mat(makeUnysisCanvas(130, 130, drawUnysisTop));
  // BoxGeometry face order: +X, −X, +Y, −Y, +Z, −Z
  const box = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), [sideR, sideL, top, plain, front, plain]);
  box.position.y = H / 2;
  box.castShadow = box.receiveShadow = true;

  // Green 2-pole terminal block (bottom-left of the front), protrudes 5 mm
  const mm = 0.001;
  const tb = new THREE.Mesh(new THREE.BoxGeometry(12 * mm, 11 * mm, 6 * mm),
    new THREE.MeshStandardMaterial({ color: 0x3fbf3f, roughness: 0.55 }));
  tb.position.set(-W / 2 + 10 * mm, 9 * mm, D / 2 + 3 * mm);
  tb.castShadow = true;
  group.add(tb);
  const holeMat = new THREE.MeshStandardMaterial({ color: 0x0c2a0c, roughness: 0.8 });
  for (const hx of [-2.8, 2.8]) {
    const hole = new THREE.Mesh(new THREE.CylinderGeometry(1.8 * mm, 1.8 * mm, 1 * mm, 16), holeMat);
    hole.rotation.x = Math.PI / 2;
    hole.position.set(tb.position.x + hx * mm, tb.position.y + 1 * mm, D / 2 + 6.1 * mm);

  const led = new THREE.Mesh(new THREE.CircleGeometry(1.3 * mm, 16),

  group.add(nonPickable(led));

  return placeOnSurface(group, { id, x, y, z, ry, parent });
}

// Tube between two points, added to `group` (chair frames etc.)
function addTube(group, a, b, r, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dir.length(), 12), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  m.castShadow = true;
  group.add(m);
  return m;
}

function addFoldingChair({ id, x = 0, z = 0, ry = 0 } = {}) {

    const xx = sx * (W / 2 - 0.02);
    addTube(group, V(xx, 0, 0.22), V(xx, H, -0.2), r, frameMat);      // front leg → backrest upright
    addTube(group, V(xx, 0, -0.24), V(xx, seatY, 0.18), r, frameMat); // rear leg → seat front
    addTube(group, V(xx, seatY - 0.01, -0.12), V(xx, seatY - 0.01, 0.2), r * 0.8, frameMat); // seat rail
  }
  addTube(group, V(-W / 2 + 0.02, 0.12, 0.155), V(W / 2 - 0.02, 0.12, 0.155), r, frameMat); // front footrest
  addTube(group, V(-W / 2 + 0.02, 0.06, -0.21), V(W / 2 - 0.02, 0.06, -0.21), r, frameMat); // rear stretcher

  const seat = new THREE.Mesh(new THREE.BoxGeometry(W - 0.02, 0.02, 0.36), panelMat);

  seat.castShadow = seat.receiveShadow = true;

  back.position.set(0, H - 0.08, -0.165);
  back.rotation.x = -0.2;
  back.castShadow = true;
  group.add(back);

  return placeOnSurface(group, { id, x, y: 0, z, ry });
}

const canvas = renderer.domElement;
const raycaster = new THREE.Raycaster();
raycaster.params.Line.threshold = 0.005;
const pointer = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPoint = new THREE.Vector3();
const grabOffset = new THREE.Vector3();

const ROT_SNAP = Math.PI / 12; // 15°
const drag = {
  obj: null,
  mode: 'none', // 'move' | 'rotate' | 'light'
  startAngle: 0,
  startRotY: 0,
  lightPlane: new THREE.Plane(new THREE.Vector3(0, 0, 1), 0),
  wallPlane: new THREE.Plane(new THREE.Vector3(1, 0, 0), 0),
  surfacePlane: new THREE.Plane(new THREE.Vector3(0, 1, 0), 0),
};

function setPointerNDC(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
}

function pickFurniture(clientX, clientY) {
  setPointerNDC(clientX, clientY);
  raycaster.setFromCamera(pointer, activeCamera);
  const hits = raycaster.intersectObjects(furniture.filter(f => f.visible), true).filter(h => {
    for (let o = h.object; o; o = o.parent) if (!o.visible) return false;   // skip hidden children
    return true;
  });
  if (!hits.length) return null;
  const roots = new Set(furniture);
  let node = hits[0].object;
  while (node && !roots.has(node)) node = node.parent;
  return node || null;
}

// Selection happens on mouse-up, and only for a click (pointer moved less than CLICK_TOL px).
// A drag (orbit, pan or moving an item) does not change the selection.
const CLICK_TOL = 4;
let pressed = null; // { x, y, target } recorded at mouse-down
function onMouseDown(e) {
  if (e.button !== 0) return;
  const obj = pickFurniture(e.clientX, e.clientY);
  pressed = { x: e.clientX, y: e.clientY, target: obj ?? (pickBooth() ? booth : null) };
  if (!obj) return;                 // empty space / booth: orbit; selection decided on mouse-up
  if (obj !== infoObj) return;      // only the selected item can be moved / rotated; else orbit
  if (obj.userData.locked) return;  // locked: no drag; selection decided on mouse-up
  drag.obj = obj;

  if (obj.userData.parentId) {
    // Anchored item: move (or Shift-rotate) on the parent's top, in the parent's local frame
    const topY = obj.getWorldPosition(new THREE.Vector3()).y;
    drag.surfacePlane.set(new THREE.Vector3(0, 1, 0), -topY);
    raycaster.ray.intersectPlane(drag.surfacePlane, hitPoint);
    const local = obj.parent.worldToLocal(hitPoint.clone());
    if (e.shiftKey && obj.userData.arm) {
      drag.mode = 'swivel';
      drag.startX = e.clientX;
      drag.startSwivel = obj.userData.arm.swivel;
      document.body.style.cursor = 'ew-resize';
    } else if (e.shiftKey && obj.userData.lockZ === undefined) {
      drag.mode = 'surface-rotate';
      drag.startAngle = Math.atan2(local.x - obj.position.x, local.z - obj.position.z);
      drag.startRotY = obj.rotation.y;
      document.body.style.cursor = 'ew-resize';
    } else {
      drag.mode = 'surface';
      grabOffset.set(local.x - obj.position.x, 0, local.z - obj.position.z);
      document.body.style.cursor = 'grabbing';
    }
  } else if (obj.userData.wallX !== undefined) {
    // Wall item: slide along Z on its wall plane (no rotation, no height change)
    drag.mode = 'wall';
    drag.wallPlane.set(new THREE.Vector3(1, 0, 0), -obj.userData.wallX);
    raycaster.ray.intersectPlane(drag.wallPlane, hitPoint);
    grabOffset.set(0, 0, hitPoint.z - obj.position.z);
    document.body.style.cursor = 'ew-resize';
  } else if (obj.userData.isLight) {
    drag.mode = 'light';
    drag.lightPlane.set(new THREE.Vector3(0, 0, 1), -obj.position.z);
    raycaster.ray.intersectPlane(drag.lightPlane, hitPoint);
    grabOffset.set(hitPoint.x - obj.position.x, hitPoint.y - obj.position.y, 0);
    document.body.style.cursor = 'grabbing';
  } else if (e.shiftKey) {
    raycaster.ray.intersectPlane(dragPlane, hitPoint);
    drag.mode = 'rotate';
    drag.startAngle = Math.atan2(hitPoint.x - obj.position.x, hitPoint.z - obj.position.z);
    drag.startRotY  = obj.rotation.y;
    document.body.style.cursor = 'ew-resize';

    raycaster.ray.intersectPlane(dragPlane, hitPoint);
    drag.mode = 'move';

// Plane the pointer ray is cast against for each drag mode
function dragPlaneFor(mode) {
  if (mode === 'light') return drag.lightPlane;
  if (mode === 'wall') return drag.wallPlane;
  if (mode.startsWith('surface')) return drag.surfacePlane;
  return dragPlane;
}

// Live-update the Properties pane while dragging, only if it already shows this item
function refreshInfo(obj) { if (infoObj === obj) showInfo(obj); }

function onMouseMove(e) {
  if (!drag.obj) return;
  if (e.buttons === 0) { onMouseUp(e); return; }
  if (drag.mode === 'swivel') {
    const o = drag.obj;
    o.userData.arm.swivel = Math.round((drag.startSwivel + (e.clientX - drag.startX) * 0.5) / 5) * 5;
    updateArm(o);
    refreshInfo(o);
    return;
  }
  setPointerNDC(e.clientX, e.clientY);
  raycaster.setFromCamera(pointer, activeCamera);
  if (!raycaster.ray.intersectPlane(dragPlaneFor(drag.mode), hitPoint)) return;

  if (drag.mode.startsWith('surface')) {
    const o = drag.obj, local = o.parent.worldToLocal(hitPoint.clone());
    const FINE = 0.01; // 10 mm steps on a table top
    if (drag.mode === 'surface-rotate') {
      const a = Math.atan2(local.x - o.position.x, local.z - o.position.z);
      o.rotation.y = Math.round((drag.startRotY + a - drag.startAngle) / ROT_SNAP) * ROT_SNAP;
    } else {
      o.position.x = Math.round((local.x - grabOffset.x) / FINE) * FINE;
      o.position.z = Math.round((local.z - grabOffset.z) / FINE) * FINE;
    }
    clampToParentTop(o);
    refreshInfo(o);
    return;
  }

  if (drag.mode === 'wall') {
    const { wallMinZ, wallMaxZ } = drag.obj.userData;
    const nz = Math.round((hitPoint.z - grabOffset.z) / SNAP) * SNAP;
    drag.obj.position.z = THREE.MathUtils.clamp(nz, wallMinZ, wallMaxZ);
    refreshInfo(drag.obj);
    return;
  }

  if (drag.mode === 'light') {
    let nx = Math.round((hitPoint.x - grabOffset.x) / SNAP) * SNAP;
    let ny = Math.round((hitPoint.y - grabOffset.y) / SNAP) * SNAP;
    drag.obj.position.x = THREE.MathUtils.clamp(nx, BOUND_MIN, BOUND_MAX);
    drag.obj.position.y = THREE.MathUtils.clamp(ny, 0.2, 4.0);
    refreshInfo(drag.obj);
    return;
  }

  if (drag.mode === 'rotate') {
    const a = Math.atan2(hitPoint.x - drag.obj.position.x, hitPoint.z - drag.obj.position.z);
    let ry = drag.startRotY + (a - drag.startAngle);
    drag.obj.rotation.y = Math.round(ry / ROT_SNAP) * ROT_SNAP;
  } else {
    const { w, d } = drag.obj.userData;
    let cx = Math.round((hitPoint.x - grabOffset.x) / SNAP) * SNAP;
    let cz = Math.round((hitPoint.z - grabOffset.z) / SNAP) * SNAP;
    drag.obj.position.x = THREE.MathUtils.clamp(cx, BOUND_MIN + w / 2, BOUND_MAX - w / 2);
    drag.obj.position.z = THREE.MathUtils.clamp(cz, BOUND_MIN + d / 2, BOUND_MAX - d / 2);

}

function onMouseUp(e) {

  if (!drag.obj) return;
  saveLayout();
  drag.obj = null;
  drag.mode = 'none';
  controls.enabled = true;
  document.body.style.cursor = '';
}

function makeLabel(text) {

  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#ffd166';
  ctx.font = 'bold 32px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sprite.scale.set(1.2, 0.3, 1);
  return sprite;
}

    // Stand at the visitor spot; pivot just in front of the eye, toward the fan
    const p = visitorPreset();
    const eye = new THREE.Vector3(...p.pos);
    camera.position.copy(eye);
    controls.target.copy(eye).addScaledVector(p.target.clone().sub(eye).normalize(), LOOK_RADIUS);
    setControlMode('look');
  } else {
    const p = presets[name];
    setControlMode('orbit');
    camera.position.set(...p.pos);
    controls.target.copy(p.target);
  }
  controls.update();
  ['persp', 'top', 'front', 'visitor'].forEach(n => document.getElementById('view-' + n).classList.toggle('active', n === name));
}
document.getElementById('view-persp').onclick = () => setView('persp');
document.getElementById('view-top').onclick   = () => setView('top');
document.getElementById('view-front').onclick = () => setView('front');
document.getElementById('view-visitor').onclick = () => setView('visitor');
setView('front'); // default camera on load

const gridBtn = document.getElementById('toggle-grid');
gridBtn.onclick = () => {
  grid.visible = !grid.visible;
  for (const obj of furniture) {
    if (obj.userData.isLight) obj.material.visible = grid.visible;
  }
  gridBtn.classList.toggle('active', grid.visible);
};

const yGridBtn = document.getElementById('toggle-ygrid');
yGridBtn.onclick = () => {
  yGrid.visible = !yGrid.visible;
  yGridBtn.classList.toggle('active', yGrid.visible);
};

const isoBtn = document.getElementById('toggle-iso');
isoBtn.onclick = () => {
  const turningOn = activeCamera === camera;
  activeCamera = turningOn ? isoCamera : camera;
  if (turningOn) fitIsoFrustum();
  bindControls(activeCamera);   // also leaves visitor look mode (orbit controls, normal lens)
  renderPass.camera = outlinePass.renderCamera = activeCamera;
  isoBtn.classList.toggle('active', turningOn);
  // The view presets belong to the perspective camera: none is current in Iso, and after
  // leaving Iso the camera is wherever it was, so clear their highlight either way.
  ['persp', 'top', 'front', 'visitor'].forEach(n => document.getElementById('view-' + n).classList.remove('active'));
};

document.getElementById('reset-layout').onclick = () => {
  if (!confirm('Clear saved layout and reload with the default positions?')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
};

// --- Resize ---
// --- Post-processing: render → outline (hover highlight from the Items list) → output (tone map + sRGB) ---
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, activeCamera);
const outlinePass = new OutlinePass(new THREE.Vector2(app.clientWidth, app.clientHeight), scene, activeCamera);
Object.assign(outlinePass, { edgeStrength: 5, edgeGlow: 0.4, edgeThickness: 1.5, pulsePeriod: 0 });
outlinePass.visibleEdgeColor.set(0xffd166);
outlinePass.hiddenEdgeColor.set(0xb38a2a);   // edges behind other objects still show, dimmer
composer.addPass(renderPass);
composer.addPass(outlinePass);
composer.addPass(new OutputPass());

// UI start-up (needs outlinePass): fill the Items list and show the empty selection state
buildItemList();
showInfo(null);

// The viewport (#app) changes size with the window and when a side pane is shown / hidden.
function resizeViewport() {
  const w = app.clientWidth, h = app.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  fitIsoFrustum();
  renderer.setSize(w, h);
  composer.setSize(w, h);
}
new ResizeObserver(resizeViewport).observe(app);

// --- Loop ---
const ROT_PER_SEC = Math.PI / 180; // 1°/s
function tick() {
  const dt = animClock.getDelta();
  for (const o of animatedItems) o.rotation.y += ROT_PER_SEC * dt;
  updateQueueStraps();
  controls.update();
  composer.render();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
